<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d1b">
  <meta name="description" content="ILMIX — mavzularni sodda va tushunarli o‘rganish platformasi.">
  <title>ILMIX — Har bir mavzu tushunarli</title>

  <style>
    :root {
      --bg: #090d1b;
      --panel: #11182b;
      --line: rgba(160,177,220,.13);
      --text: #f4f6ff;
      --muted: #9aa8c7;
      --blue: #6d8cff;
      --purple: #a16bff;
      --cyan: #5bd6e8;
      --green: #62d6a3;
      --shadow: 0 18px 50px rgba(0,0,0,.25);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 0%, rgba(80,102,220,.17), transparent 35%),
        radial-gradient(ellipse at 90% 15%, rgba(142,77,220,.13), transparent 30%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, a, input, select, textarea {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: min(1440px, 100%);
      margin: auto;
      padding: 0 34px 48px;
    }

    .topbar {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      gap: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .4px;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      box-shadow: 0 8px 25px #735cff55;
      font-size: 19px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.3px;
      margin-top: 1px;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav button, .profile-btn {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 11px 15px;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .nav button:hover, .nav button.active {
      color: white;
      background: rgba(117,139,255,.13);
    }

    .profile-btn {
      border: 1px solid var(--line);
      color: var(--text);
    }

    .mobile-menu {
      display: none;
    }

    .page {
      display: none;
      padding-top: 34px;
      animation: appear .25s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    .eyebrow {
      color: #a9b9ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 11px;
      font-weight: 750;
    }

    h1 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.08;
      letter-spacing: -1.8px;
      margin: 15px 0;
    }

    h2 {
      font-size: 25px;
      letter-spacing: -.5px;
      margin: 0;
    }

    h3 {
      font-size: 17px;
      margin: 0 0 8px;
    }

    p {
      color: var(--muted);
      line-height: 1.65;
    }

    .gradient-text {
      background: linear-gradient(90deg,#91aaff,#c18cff,#69d9e9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero {
      min-height: 365px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 30px;
      padding: 45px 50px;
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(115deg, rgba(29,43,82,.94), rgba(29,24,63,.86));
      box-shadow: var(--shadow);
      position: relative;
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      right: 5%;
      top: -100px;
      border-radius: 50%;
      background: radial-gradient(circle,rgba(130,112,255,.27),rgba(91,214,232,.06) 55%,transparent 70%);
      pointer-events: none;
    }

    .hero-copy, .hero-art {
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      max-width: 650px;
    }

    .hero p {
      max-width: 560px;
      font-size: 16px;
    }

    .hero-art {
      display: grid;
      place-items: center;
      min-height: 230px;
    }

    .orbit {
      width: 220px;
      height: 220px;
      border: 1px solid #9baaff55;
      border-radius: 50%;
      display: grid;
      place-items: center;
      box-shadow: 0 0 70px #7c75ff25, inset 0 0 55px #7c75ff18;
      position: relative;
    }

    .orbit:before, .orbit:after {
      content: "";
      position: absolute;
      border: 1px solid #a4b4ff36;
      border-radius: 50%;
    }

    .orbit:before {
      width: 280px;
      height: 110px;
      transform: rotate(-30deg);
    }

    .orbit:after {
      width: 110px;
      height: 280px;
      transform: rotate(30deg);
    }

    .orbit-core {
      width: 112px;
      height: 112px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      font-size: 43px;
      font-weight: 900;
      background: linear-gradient(140deg,#648cff,#a16bff);
      box-shadow: 0 15px 55px #796cff77;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 680px;
      margin-top: 25px;
      padding: 7px 8px 7px 17px;
      background: #0d1427;
      border: 1px solid #9baeff38;
      border-radius: 15px;
    }

    .search-box span {
      color: #9eb0ff;
      font-size: 20px;
    }

    .search-box input {
      min-width: 0;
      flex: 1;
      color: white;
      background: transparent;
      border: 0;
      outline: 0;
      padding: 11px 0;
    }

    .search-box input::placeholder {
      color: #7f8eaf;
    }

    .primary, .secondary {
      border: 0;
      border-radius: 12px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
      transition: .2s;
    }

    .primary {
      color: white;
      background: linear-gradient(110deg,#6388ff,#9665f5);
      box-shadow: 0 8px 22px #7869ff35;
    }

    .primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    .secondary {
      background: #ffffff0b;
      border: 1px solid var(--line);
      color: #dce4ff;
    }

    .secondary:hover {
      background: #ffffff14;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin: 36px 0 17px;
    }

    .section-head p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    .text-btn {
      color: #aebcff;
      background: transparent;
      border: 0;
      cursor: pointer;
      padding: 9px;
      touch-action: manipulation;
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 15px;
    }

    .subject-card, .card {
      background: linear-gradient(145deg,rgba(21,30,53,.96),rgba(15,22,40,.96));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 21px;
      box-shadow: 0 8px 25px #00000012;
    }

    .subject-card {
      cursor: pointer;
      transition: .2s;
      min-height: 145px;
    }

    .subject-card:hover {
      transform: translateY(-3px);
      border-color: #8296ff66;
    }

    .subject-icon {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      font-size: 22px;
      margin-bottom: 14px;
    }

    .blue { background: #547dff25; }
    .purple { background: #a16bff25; }
    .cyan { background: #5bd6e825; }
    .green { background: #62d6a325; }
    .orange { background: #ffb45c25; }
    .pink { background: #ed77b525; }

    .subject-card p {
      margin: 0;
      font-size: 13px;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 14px;
    }

    .feature-card {
      padding: 19px;
      border-radius: 17px;
      background: #ffffff08;
      border: 1px solid var(--line);
    }

    .feature-card .symbol {
      font-size: 23px;
      margin-bottom: 12px;
    }

    .feature-card p {
      font-size: 12px;
      margin: 0;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-number {
      font-size: 31px;
      font-weight: 800;
      margin-top: 9px;
    }

    .muted {
      color: var(--muted);
    }

    .lesson-layout {
      display: grid;
      grid-template-columns: minmax(0,1.5fr) minmax(260px,.8fr);
      gap: 18px;
    }

    .lesson-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .badge {
      color: #a9baff;
      background: #718cff1d;
      border: 1px solid #8299ff30;
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 11px;
      white-space: nowrap;
    }

    .lesson-body {
      margin-top: 22px;
      line-height: 1.8;
      color: #d8e0f5;
    }

    .lesson-body h3 {
      margin-top: 22px;
    }

    .example {
      border-left: 3px solid var(--cyan);
      padding: 12px 15px;
      background: #5bd6e80c;
      border-radius: 0 12px 12px 0;
      margin: 15px 0;
      color: #d8e8f4;
    }

    .formula {
      font-size: 23px;
      font-weight: 800;
      text-align: center;
      padding: 18px;
      margin: 14px 0;
      border: 1px dashed #8fa4ff55;
      border-radius: 13px;
      background: #8296ff0b;
    }

    .lesson-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 22px;
    }

    .side-list {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .side-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border-radius: 13px;
      background: #ffffff08;
      border: 1px solid var(--line);
    }

    .side-item span:first-child {
      font-size: 19px;
    }

    .notice {
      border: 1px solid #e8b85b40;
      background: #e8b85b0d;
      color: #d9c89e;
      padding: 13px 15px;
      border-radius: 13px;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 18px;
    }

    .empty {
      padding: 35px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    .topic-list {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
      margin-top: 17px;
    }

    .topic-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      background: #ffffff08;
      border: 1px solid var(--line);
    }

    .topic-row p {
      margin: 5px 0 0;
      font-size: 12px;
    }

    .progress-track {
      height: 8px;
      background: #ffffff12;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg,var(--blue),var(--purple));
      border-radius: 20px;
      transition: width .3s;
    }

    .profile-top {
      display: flex;
      align
